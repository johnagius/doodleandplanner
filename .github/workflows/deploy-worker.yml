name: Deploy Worker (API)

# Deploys the realtime sync Worker (doodleandplanner-api) so the live boards
# actually share state across devices. Runs only once the Cloudflare secrets are
# set — CLOUDFLARE_API_TOKEN (with Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID —
# and otherwise skips cleanly (no failed run / email).

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - if: env.HAS_CF == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_CF == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.HAS_CF == 'true'
        run: npm ci
      - name: Deploy Worker
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/server
          command: deploy
