name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time. Queue rather than cancel: GitHub's Pages
# backend rejects a new deployment while one is still in progress (HTTP 400), so
# letting in-flight deploys finish — and superseding only *pending* ones — avoids
# collisions when several commits land in quick succession.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (with project-page base path)
        run: npm run build
        env:
          # Project sites are served from https://<user>.github.io/<repo>/
          VITE_BASE_PATH: /doodleandplanner/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          # Real-time, multi-device rooms via the deployed Cloudflare Worker.
          # Falls back to the committed default in apps/web/.env.production; set
          # the API_BASE repo variable to override. Empty string ⇒ client-only.
          VITE_API_BASE: ${{ vars.API_BASE || 'https://doodleandplanner-api.labrint.workers.dev' }}
      - name: Add GitHub Pages SPA 404 fallback
        # 404.html lives outside Vite's public/ so it ships ONLY to GitHub Pages
        # (Cloudflare Pages uses _redirects instead). It restores deep links on
        # project sites that lack server-side rewrites.
        run: cp apps/web/gh-pages/404.html apps/web/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
