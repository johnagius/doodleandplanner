# Cloudflare Worker for Doodle & Planner real-time room sync.
# Deploy with: npx wrangler deploy   (from apps/server)
name = "doodleandplanner-api"
main = "src/index.ts"
compatibility_date = "2024-11-06"

# One Durable Object instance per room holds the room state and fans out live
# updates to every connected client over WebSockets.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

# SQLite-backed Durable Objects are available on the free Workers plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

# Allowed front-end origins (comma-separated). "*" allows any origin. Includes
# the GitHub Pages mirror so it shares the same live backend as pages.dev.
[vars]
ALLOWED_ORIGINS = "https://doodleandplanner.pages.dev,https://johnagius.github.io"
