    />
    <title>Doodle &amp; Planner</title>
    <!-- Restores the deep link encoded by public/404.html on GitHub Pages. -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>

    <div id="root"></div>

  </body>
