<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Doodle &amp; Planner</title>
    <!--
      SPA fallback for GitHub Pages project sites. Converts the requested path
      into a query string and bounces to the app root, where the snippet in
      index.html restores it via history.replaceState. pathSegmentsToKeep=1
      preserves the /<repo>/ base. (Cloudflare Pages uses _redirects instead.)
    -->
    <script>
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
