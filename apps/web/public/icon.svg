<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Doodle and Planner">
  <rect width="512" height="512" rx="112" fill="#6366f1" />
  <!-- calendar -->
  <rect x="120" y="150" width="220" height="200" rx="24" fill="#ffffff" />
  <rect x="120" y="150" width="220" height="56" rx="24" fill="#c7d2fe" />
  <circle cx="170" cy="135" r="12" fill="#ffffff" />
  <circle cx="290" cy="135" r="12" fill="#ffffff" />
  <g fill="#6366f1">
    <circle cx="170" cy="250" r="14" />
    <circle cx="230" cy="250" r="14" />
    <circle cx="290" cy="250" r="14" />
    <circle cx="170" cy="305" r="14" />
    <circle cx="230" cy="305" r="14" />
  </g>
  <!-- pencil doodling across the calendar -->
  <g transform="rotate(40 360 300)">
    <rect x="330" y="170" width="60" height="210" rx="14" fill="#f59e0b" />
    <rect x="330" y="170" width="60" height="40" fill="#fbbf24" />
    <polygon points="330,380 360,430 390,380" fill="#fde68a" />
    <polygon points="345,405 360,430 375,405" fill="#1f2333" />
  </g>
</svg>
